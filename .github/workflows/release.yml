# This workflow is used to release the project.
# It is triggered by a push to the main branch.
# And run semantic release

name: Release
permissions:
  contents: write
  pull-requests: write
  issues: write
  packages: write
  id-token: write

on:
  push:
    branches:
      - main

jobs:
  release:
    uses: health-informatics-uon/workflows/.github/workflows/semantic-release.yml@1.5.0
    with:
      node-version: "24"
    secrets: inherit

  datadict:
    needs: release
    if: needs.release.outputs.release-created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout released tag
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.release.outputs.release-tag }}

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --group dev --no-progress

      - name: Generate data dictionary CSVs
        run: uv run python scripts/gen_datadict.py

      - name: Attach CSVs to release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ needs.release.outputs.release-tag }}
          files: dist/*.csv
